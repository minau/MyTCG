services:
  database:
    ports: ["127.0.0.1:5432:5432"]
  migrate:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__Origins__0: http://localhost:8088
  api:
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Cors__Origins__0: http://localhost:8088
      Cors__Origins__1: http://localhost:5180
  reverse-proxy:
    ports: !override ["127.0.0.1:8088:80"]
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
networks:
  private: { internal: false }
